<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>摘录卡片重叠规范化排布 · 演示</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#5b9cff; --accent2:#7ee0a8;
    --warn:#ffcf6b; --danger:#ff7b7b; --edge:#8a93a6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{display:flex;flex-direction:column;height:100%}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:16px;font-weight:600}
  header p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;
    border-bottom:1px solid var(--line);background:var(--panel2);font-size:12.5px}
  .btn{background:#262b36;color:var(--text);border:1px solid var(--line);border-radius:7px;
    padding:6px 11px;cursor:pointer;font-size:12.5px;transition:.15s}
  .btn:hover{background:#303644;border-color:#3a4250}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#06101f;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  label.ctl{display:flex;align-items:center;gap:6px;color:var(--muted)}
  select,input[type=range]{accent-color:var(--accent)}
  select{background:#262b36;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  .stage{position:relative;flex:1;overflow:hidden;background:
    radial-gradient(circle at 20% 20%, #141821 0, #0f1115 60%)}
  #edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .card{position:absolute;width:160px;height:92px;border-radius:10px;
    background:linear-gradient(160deg,#2b3140,#222732);border:1px solid #3a4250;
    box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;
    padding:10px 12px;cursor:grab;user-select:none;touch-action:none;
    transition:left .26s cubic-bezier(.22,.61,.36,1), top .26s cubic-bezier(.22,.61,.36,1);}
  .card.dragging{cursor:grabbing;transition:none;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.5)}
  .card .tag{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .card .title{font-size:13.5px;font-weight:600;margin-top:6px}
  .card .body{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.A{border-color:var(--accent);background:linear-gradient(160deg,#27324a,#1d2636)}
  .card.snap{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .log{padding:8px 18px;border-top:1px solid var(--line);background:var(--panel);
    font-size:12px;color:var(--muted);max-height:118px;overflow:auto;line-height:1.7}
  .log b{color:var(--text)}
  .log .ok{color:var(--accent2)} .log .mv{color:var(--warn)}
  #code{display:none;border-top:1px solid var(--line);background:#0c0e13;
    max-height:42vh;overflow:auto;padding:0}
  #code pre{margin:0;padding:14px 18px;font-size:12px;line-height:1.65;color:#cfd6e4;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre}
  #code .cm{color:#5f6b7d} #code .kw{color:#c792ea} #code .fn{color:#82aaff}
  #code .st{color:#c3e88d} #code .nm{color:#f78c6c}
  .hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:rgba(91,156,255,.14);border:1px solid rgba(91,156,255,.4);
    color:#cfe2ff;font-size:12px;padding:6px 12px;border-radius:20px;pointer-events:none}
  .legend{position:absolute;right:14px;bottom:14px;font-size:11px;color:var(--muted);
    background:rgba(20,24,31,.7);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>摘录卡片「重叠 → 规范化排布」演示</h1>
    <p>把卡片拖到另一张卡片上重叠，松开后会自动：<b>A 固定不动</b>，<b>B 被挪到重叠那一侧、不遮挡、中心轴线对齐</b>，两者用线连接（默认无箭头）。
       支持一对多：同一父节点同侧多卡会以父卡中心为对称轴排成整齐一列/行，新增下方的卡会自动把整组往上顶。下方可设线型、箭头开关与间距。</p>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnNormalize">立即规范化</button>
    <button class="btn" id="btnDemo1">演示：单对(右)</button>
    <button class="btn" id="btnDemoN">演示：一对多(右×3)</button>
    <button class="btn" id="btnDemoLeft">演示：左侧</button>
    <button class="btn" id="btnAdd">＋ 加卡片</button>
    <button class="btn" id="btnReset">重置</button>
    <div class="sep"></div>
    <label class="ctl">线型
      <select id="selStyle">
        <option value="solid">实线</option>
        <option value="dashed">虚线</option>
      </select>
    </label>
    <label class="ctl"><input type="checkbox" id="chkArrow" /> 显示箭头</label>
    <label class="ctl">间距 <input type="range" id="rngGap" min="10" max="60" value="28" /> <span id="gapVal">28</span></label>
    <div class="sep"></div>
    <button class="btn" id="btnCode">显示实现代码</button>
  </div>

  <div class="stage" id="stage">
    <svg id="edges"></svg>
    <div class="hint" id="hint">拖动卡片使其与另一张重叠，松手即规范化</div>
    <div class="legend">蓝色=父节点(A) · 灰=子节点(B)<br/>拖动重叠 → 自动贴边对齐+连线</div>
  </div>

  <div class="log" id="log"></div>
  <div id="code"></div>
</div>

<script>
/* =========================================================================
   核心算法（与插件 main.js 同源思路，纯函数便于测试）
   坐标：卡片 {id,x,y,w,h,...}；x/y 为画布左上角坐标
   edges: Map(childId -> {parent, side})   side ∈ right|left|top|bottom
   ========================================================================= */

// 1) 两矩形重叠率：交集面积 / 较小矩形面积
function overlapRatio(a, b){
  const ix = Math.max(0, Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x));
  const iy = Math.max(0, Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y));
  const inter = ix * iy;
  if (inter <= 0) return 0;
  const small = Math.min(a.w*a.h, b.w*b.h);
  return small > 0 ? inter / small : 0;
}

// 2) 由拖放落点(被拖卡中心)相对父卡中心，判定贴哪一侧（主轴优先）
function sideOf(child, parent){
  const ccx = child.x + child.w/2, ccy = child.y + child.h/2;
  const pcx = parent.x + parent.w/2, pcy = parent.y + parent.h/2;
  const dx = ccx - pcx, dy = ccy - pcy;
  if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'right' : 'left';
  return dy >= 0 ? 'bottom' : 'top';
}

// 3) 计算 child 贴到 parent 某侧、不遮挡且中心轴对齐的目标坐标
function snapChild(parent, child, side, gap){
  const out = {x: child.x, y: child.y};
  if (side === 'right'){
    out.x = parent.x + parent.w + gap;
    out.y = parent.y + parent.h/2 - child.h/2;        // 竖直中心轴对齐
  } else if (side === 'left'){
    out.x = parent.x - child.w - gap;
    out.y = parent.y + parent.h/2 - child.h/2;
  } else if (side === 'top'){
    out.x = parent.x + parent.w/2 - child.w/2;        // 水平中心轴对齐
    out.y = parent.y - child.h - gap;
  } else { // bottom
    out.x = parent.x + parent.w/2 - child.w/2;
    out.y = parent.y + parent.h + gap;
  }
  return out;
}

// 4) 一对多：把某父卡同一侧的所有子卡，以父卡中心为对称轴排成整齐一列(右/左)或一行(上/下)
//    整列/整行居中于父卡中心轴；新增下方的卡会自动把整组往上顶，保持对称。
function layoutChildren(parent, children, side, gap){
  if (!children.length) return;
  const vertical = (side==='right'||side==='left'); // 右/左：竖直列
  const stackAxis = vertical ? 'y' : 'x';
  // 沿堆叠轴排序，保持相对顺序稳定
  children.sort((p,q)=> p[stackAxis]-q[stackAxis] || p.x-q.x);

  if (vertical){
    // 列：所有子卡左 x 对齐（贴到父卡右侧/左侧），整列竖直居中于父卡
    const x = side==='right' ? parent.x + parent.w + gap
                             : parent.x - children[0].w - gap;
    const totalH = children.reduce((s,c)=>s+c.h,0) + gap*(children.length-1);
    const axisY = parent.y + parent.h/2;
    let y = axisY - totalH/2;
    for (const c of children){ c.x = x; c.y = y; y += c.h + gap; }
  } else {
    // 行：所有子卡 y 对齐（贴到父卡上/下），整行水平居中于父卡
    const y = side==='bottom' ? parent.y + parent.h + gap
                              : parent.y - children[0].h - gap;
    const totalW = children.reduce((s,c)=>s+c.w,0) + gap*(children.length-1);
    const axisX = parent.x + parent.w/2;
    let x = axisX - totalW/2;
    for (const c of children){ c.x = x; c.y = y; x += c.w + gap; }
  }
}

// 5) 拖放结束：找重叠最多的父卡，固定父、挪动子、连线、重排同侧
const OVERLAP_THRESHOLD = 0.12;
function normalizeOnDrop(cards, edges, draggedId, gap, log){
  const d = cards.find(c=>c.id===draggedId);
  let best=null, bestR=0;
  for (const o of cards){
    if (o.id===draggedId) continue;
    const r = overlapRatio(d, o);
    if (r>bestR){ bestR=r; best=o; }
  }
  if (best && bestR >= OVERLAP_THRESHOLD){
    const side = sideOf(d, best);
    edges.set(draggedId, {parent: best.id, side});        // 父固定，子记为从属
    relayoutSide(cards, edges, best.id, side, gap);
    log && log(`卡片「${d.label}」与「${best.label}」重叠 ${(bestR*100|0)}% → 贴到<b>${sideName(side)}</b>，连线`, 'mv');
    return true;
  }
  // 无重叠：解除从属
  if (edges.has(draggedId)){ edges.delete(draggedId); log && log(`卡片「${d.label}」已离开，解除连线`, 'ok'); }
  return false;
}
function relayoutSide(cards, edges, parentId, side, gap){
  const parent = cards.find(c=>c.id===parentId);
  const kids = cards.filter(c=> edges.get(c.id) && edges.get(c.id).parent===parentId && edges.get(c.id).side===side);
  layoutChildren(parent, kids, side, gap);
}
function sideName(s){return {right:'右侧',left:'左侧',top:'上方',bottom:'下方'}[s]||s;}

/* ===================== 以下为演示交互层（非算法核心） ===================== */
const stage = document.getElementById('stage');
const svg = document.getElementById('edges');
const logEl = document.getElementById('log');
const hintEl = document.getElementById('hint');
let cards = [];
let edges = new Map();
let gap = 28;
let seq = 0;
const PALETTE = ['#5b9cff','#7ee0a8','#ffcf6b','#ff9d6b','#c792ea','#6be0d8'];

function log(msg, cls){
  const t = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  logEl.insertAdjacentHTML('afterbegin', `<div><span style="color:#5f6b7d">${t}</span> ${msg?`<span class="${cls||''}">${msg}</span>`:''}</div>`);
}
function uid(){ return 'c'+(++seq); }

function makeCard(opts){
  const c = Object.assign({id:uid(), w:160, h:92, color:PALETTE[seq%PALETTE.length],
    title:'摘录', body:'拖动我到另一张卡片上重叠…'}, opts);
  cards.push(c); return c;
}

function render(){
  // 清掉旧卡片节点（保留 svg）
  [...stage.querySelectorAll('.card')].forEach(n=>n.remove());
  for (const c of cards){
    const el = document.createElement('div');
    el.className = 'card' + (isParent(c.id)?' A':'');
    el.style.left = c.x+'px'; el.style.top = c.y+'px';
    el.style.width = c.w+'px'; el.style.height = c.h+'px';
    el.style.borderLeft = `4px solid ${c.color}`;
    el.dataset.id = c.id;
    el.innerHTML = `<div class="tag"><span>摘录卡</span><span>#${c.id.slice(1)}</span></div>
      <div class="title">${c.title}</div><div class="body">${c.body}</div>`;
    stage.appendChild(el);
    attachDrag(el, c);
  }
  drawEdges();
}
function isParent(id){ return [...edges.values()].some(e=>e.parent===id); }

function drawEdges(){
  const style = document.getElementById('selStyle').value;
  const arrow = document.getElementById('chkArrow').checked;
  let s = '';
  if (arrow){
    s += `<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
      orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--edge)"/></marker></defs>`;
  }
  for (const [childId, e] of edges){
    const p = cards.find(c=>c.id===e.parent), k = cards.find(c=>c.id===childId);
    if (!p||!k) continue;
    const a = endpoint(p, e.side, +1), b = endpoint(k, e.side, -1);
    const dash = style==='dashed' ? 'stroke-dasharray="6 5"' : '';
    const mk = arrow ? 'marker-end="url(#ar)"' : '';
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--edge)"
      stroke-width="1.8" ${dash} ${mk} opacity="0.85"/>`;
  }
  svg.innerHTML = s;
}
// 连线端点：取父子相邻边的中点
function endpoint(card, side, dir){
  const cx = card.x+card.w/2, cy = card.y+card.h/2;
  if (side==='right') return {x:card.x+card.w, y:cy};
  if (side==='left')  return {x:card.x, y:cy};
  if (side==='top')   return {x:cx, y:card.y};
  return {x:cx, y:card.y+card.h}; // bottom
}

let drag=null;
function attachDrag(el, c){
  el.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const r = stage.getBoundingClientRect();
    drag = {c, el, offX: ev.clientX - r.left - c.x, offY: ev.clientY - r.top - c.y, moved:false};
    el.classList.add('dragging'); el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener('pointermove', ev=>{
    if (!drag || drag.c!==c) return;
    const r = stage.getBoundingClientRect();
    let nx = ev.clientX - r.left - drag.offX;
    let ny = ev.clientY - r.top - drag.offY;
    nx = Math.max(0, Math.min(nx, stage.clientWidth - c.w));
    ny = Math.max(0, Math.min(ny, stage.clientHeight - c.h));
    c.x = nx; c.y = ny; drag.moved = true;
    el.style.left = nx+'px'; el.style.top = ny+'px';
    if (hintEl) hintEl.style.display='none';
  });
  el.addEventListener('pointerup', ev=>{
    if (!drag || drag.c!==c) return;
    el.classList.remove('dragging'); el.classList.add('snap');
    setTimeout(()=>el.classList.remove('snap'),320);
    if (drag.moved) normalizeOnDrop(cards, edges, c.id, gap, log);
    drag=null; render();
  });
}

/* ---------- 场景演示 ---------- */
function reset(){
  cards=[]; edges=new Map(); seq=0; logEl.innerHTML='';
  const cx = stage.clientWidth/2 - 80, cy = stage.clientHeight/2 - 46;
  const A = makeCard({x:cx, y:cy, title:'卡片 A（父）', body:'我固定不动，谁来重叠我都把它贴到对应侧。', color:'#5b9cff'});
  render(); return A;
}
function demoRight(){
  const A = reset();
  const B = makeCard({x:A.x+50, y:A.y+18, title:'卡片 B（子）', body:'我故意压在 A 右侧重叠，松手后被挪正。'});
  render();
  setTimeout(()=>{ normalizeOnDrop(cards, edges, B.id, gap, log); render(); }, 500);
}
function demoMany(){
  const A = reset();
  const mk=(dx,dy,t)=>makeCard({x:A.x+dx,y:A.y+dy,title:t,body:'同侧多卡自动排成整齐一列。'});
  const b1=mk(60,10,'B1'), b2=mk(70,30,'B2'), b3=mk(40,-5,'B3');
  render();
  setTimeout(()=>{
    [b1,b2,b3].forEach(b=>{ edges.set(b.id,{parent:A.id,side:'right'}); });
    relayoutSide(cards, edges, A.id, 'right', gap); render();
    log(`一对多：A 右侧 3 张子卡对齐成列`,'mv');
  }, 500);
}
function demoLeft(){
  const A = reset();
  const B = makeCard({x:A.x-60, y:A.y+15, title:'卡片 B（子）', body:'我压在 A 左侧重叠。'});
  render();
  setTimeout(()=>{ normalizeOnDrop(cards, edges, B.id, gap, log); render(); }, 500);
}

/* ---------- 绑定 ---------- */
document.getElementById('btnNormalize').onclick = ()=>{
  // 全局扫描：对任意仍重叠的卡片对做规范化（演示用）
  let changed=true, guard=0;
  while(changed && guard++<20){
    changed=false;
    for (const c of cards){
      for (const o of cards){
        if (c.id===o.id) continue;
        if (overlapRatio(c,o) >= OVERLAP_THRESHOLD){
          const side = sideOf(c,o);
          edges.set(c.id,{parent:o.id,side});
          relayoutSide(cards,edges,o.id,side,gap);
          changed=true;
        }
      }
    }
  }
  render(); log('已对画布内所有重叠卡片执行规范化','ok');
};
document.getElementById('btnDemo1').onclick = demoRight;
document.getElementById('btnDemoN').onclick = demoMany;
document.getElementById('btnDemoLeft').onclick = demoLeft;
document.getElementById('btnAdd').onclick = ()=>{
  makeCard({x:40+Math.random()*200, y:40+Math.random()*160, title:'新卡片', body:'自由拖拽，重叠即连线。'});
  render();
};
document.getElementById('btnReset').onclick = ()=>{ reset(); log('已重置场景','ok'); };
document.getElementById('selStyle').onchange = drawEdges;
document.getElementById('chkArrow').onchange = drawEdges;
document.getElementById('rngGap').oninput = e=>{
  gap = +e.target.value; document.getElementById('gapVal').textContent = gap;
  render();
};
document.getElementById('btnCode').onclick = ()=>{
  const box = document.getElementById('code');
  const open = box.style.display!=='block';
  box.style.display = open?'block':'none';
  if (open && !box.dataset.filled){ box.innerHTML = CODE_HTML; box.dataset.filled='1'; }
  document.getElementById('btnCode').textContent = open?'隐藏实现代码':'显示实现代码';
};

/* ---------- 代码面板内容（高亮为演示用，非执行） ---------- */
const CODE_HTML = `<pre><span class="cm">// ===== 核心算法（与插件同源，纯函数） =====</span>
<span class="kw">function</span> <span class="fn">overlapRatio</span>(a,b){              <span class="cm">// 重叠率 = 交集 / 较小卡面积</span>
  <span class="kw">const</span> ix=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
  <span class="kw">const</span> iy=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  <span class="kw">return</span> ix*iy / Math.min(a.w*a.h, b.w*b.h);
}
<span class="kw">function</span> <span class="fn">sideOf</span>(child,parent){       <span class="cm">// 落点中心在父卡哪一侧</span>
  <span class="kw">const</span> dx=(child.x+child.w/2)-(parent.x+parent.w/2);
  <span class="kw">const</span> dy=(child.y+child.h/2)-(parent.y+parent.h/2);
  <span class="kw">return</span> Math.abs(dx)&gt;=Math.abs(dy) ? (dx&gt;=0?<span class="st">'right'</span>:<span class="st">'left'</span>)
                                     : (dy&gt;=0?<span class="st">'bottom'</span>:<span class="st">'top'</span>);
}
<span class="kw">function</span> <span class="fn">snapChild</span>(parent,child,side,gap){ <span class="cm">// 贴边+中心轴对齐，不遮挡</span>
  <span class="kw">if</span>(side===<span class="st">'right'</span>)  <span class="kw">return</span> {x:parent.x+parent.w+gap, y:parent.y+parent.h/2-child.h/2};
  <span class="kw">if</span>(side===<span class="st">'left'</span>)   <span class="kw">return</span> {x:parent.x-child.w-gap, y:parent.y+parent.h/2-child.h/2};
  <span class="kw">if</span>(side===<span class="st">'top'</span>)    <span class="kw">return</span> {x:parent.x+parent.w/2-child.w/2, y:parent.y-child.h-gap};
  <span class="kw">return</span> {x:parent.x+parent.w/2-child.w/2, y:parent.y+parent.h+gap}; <span class="cm">// bottom</span>
}
<span class="kw">function</span> <span class="fn">layoutChildren</span>(parent,kids,side,gap){ <span class="cm">// 一对多：以父卡中心对称排列</span>
  <span class="kw">const</span> vertical = (side==<span class="st">'right'</span>||side==<span class="st">'left'</span>);
  kids.sort((p,q)=&gt; vertical ? p.y-q.y : p.x-q.x);
  <span class="kw">if</span>(vertical){
    <span class="kw">const</span> x = side==<span class="st">'right'</span> ? parent.x+parent.w+gap : parent.x-kids[0].w-gap;
    <span class="kw">const</span> totalH = kids.reduce((s,c)=&gt;s+c.h,0) + gap*(kids.length-1);
    <span class="kw">let</span> y = parent.y+parent.h/2 - totalH/2;
    <span class="kw">for</span>(<span class="kw">const</span> c <span class="kw">of</span> kids){ c.x=x; c.y=y; y+=c.h+gap; }
  }<span class="kw">else</span>{
    <span class="kw">const</span> y = side==<span class="st">'bottom'</span> ? parent.y+parent.h+gap : parent.y-kids[0].h-gap;
    <span class="kw">const</span> totalW = kids.reduce((s,c)=&gt;s+c.w,0) + gap*(kids.length-1);
    <span class="kw">let</span> x = parent.x+parent.w/2 - totalW/2;
    <span class="kw">for</span>(<span class="kw">const</span> c <span class="kw">of</span> kids){ c.x=x; c.y=y; x+=c.w+gap; }
  }
}
<span class="cm">// 拖放结束：固定父、挪动子、连线、重排同侧</span>
<span class="kw">function</span> <span class="fn">normalizeOnDrop</span>(cards,edges,draggedId,gap,log){
  <span class="kw">const</span> d=cards.find(c=&gt;c.id===draggedId);
  <span class="kw">let</span> best=<span class="nm">null</span>,bestR=0;
  <span class="kw">for</span>(<span class="kw">const</span> o <span class="kw">of</span> cards){ <span class="kw">if</span>(o.id===draggedId)<span class="kw">continue</span>;
    <span class="kw">const</span> r=<span class="fn">overlapRatio</span>(d,o); <span class="kw">if</span>(r&gt;bestR){bestR=r;best=o;} }
  <span class="kw">if</span>(best &amp;&amp; bestR&gt;=<span class="nm">0.12</span>){
    <span class="kw">const</span> side=<span class="fn">sideOf</span>(d,best);
    edges.set(draggedId,{parent:best.id,side});          <span class="cm">// 父固定，子从属</span>
    <span class="fn">relayoutSide</span>(cards,edges,best.id,side,gap);
    <span class="kw">return</span> <span class="nm">true</span>;
  }
  edges.delete(draggedId); <span class="kw">return</span> <span class="nm">false</span>;
}</pre>`;
